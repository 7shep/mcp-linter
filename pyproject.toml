[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-linter"
version = "1.2.0"
description = "Lint MCP servers against agent-friendly tool design principles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "httpx2"]
keywords = ["mcp", "model-context-protocol", "lint", "linter", "llm", "agents", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/7shep/mcp-linter"
Repository = "https://github.com/7shep/mcp-linter"
Issues = "https://github.com/7shep/mcp-linter/issues"
Changelog = "https://github.com/7shep/mcp-linter/releases"

[project.scripts]
mcp-lint = "mcp_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lint"]
