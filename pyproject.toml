[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-linter"
version = "1.0.0"
description = "Lint MCP servers against agent-friendly tool design principles."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.1"]

[project.scripts]
mcp-lint = "mcp_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lint"]
